# Clúster Apache Kafka de GestorCitas: ensemble de 3 Zookeeper + 3 brokers + Kafka UI + creación de tópicos.
#
#   docker compose up -d                       -> levanta todo y crea los tópicos (kafka-init)
#   docker compose run --rm kafka-init         -> vuelve a aplicar scripts/topicos.sh
#   Kafka UI: http://<host>:8090 (usuario y clave del .env)
#
# Listeners de cada broker:
#   INTERNAL  kafkaN:29092  -> tráfico entre brokers y contenedores en la red "gestorcitas-kafka"
#   EXTERNAL  ${KAFKA_ADVERTISED_HOST}:9092/9093/9094 -> clientes fuera de Docker
#             (tu Mac: localhost; en AWS: IP privada de la EC2 de Kafka, la usan los microservicios de la EC2-B)
#
# Zookeeper: 3 nodos forman un ensemble con quórum de 2. Guarda los metadatos del clúster (brokers vivos,
# controlador, líderes de partición, configuración de tópicos); si cae 1 nodo, los otros 2 mantienen el quórum.
#
# Tolerancia a fallos: factor de replicación 3 y min.insync.replicas 2 -> con acks=all el clúster
# sigue aceptando escrituras con 1 broker caído. La creación automática de tópicos está desactivada:
# los tópicos se crean explícitamente (kafka-init) con su número de particiones, retención y limpieza.
x-kafka-broker: &kafka-broker
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    zookeeper1: {condition: service_healthy}
    zookeeper2: {condition: service_healthy}
    zookeeper3: {condition: service_healthy}
  networks: [kafka]

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx${KAFKA_HEAP:-512m}"
  TZ: America/Santiago

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 30s

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  healthcheck:
    # "srvr" es el único comando de 4 letras habilitado por defecto; responde "Mode: leader|follower"
    # solo cuando el nodo forma parte de un quórum
    test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/2181 && echo srvr >&3 && timeout 5 cat <&3 | grep -q Mode"]
    interval: 10s
    timeout: 10s
    retries: 18
    start_period: 20s
  networks: [kafka]

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # host:puertoSeguidores:puertoElección de los 3 nodos del ensemble
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_HEAP_OPTS: "-Xms64m -Xmx${ZOOKEEPER_HEAP:-192m}"
  TZ: America/Santiago

services:
  zookeeper1:
    <<: *zookeeper
    container_name: gestorcitas-zookeeper1
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper1-data:/var/lib/zookeeper/data
      - zookeeper1-log:/var/lib/zookeeper/log

  zookeeper2:
    <<: *zookeeper
    container_name: gestorcitas-zookeeper2
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2-data:/var/lib/zookeeper/data
      - zookeeper2-log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zookeeper
    container_name: gestorcitas-zookeeper3
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3-data:/var/lib/zookeeper/data
      - zookeeper3-log:/var/lib/zookeeper/log

  kafka1:
    <<: *kafka-broker
    container_name: gestorcitas-kafka1
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
    ports: ["9092:9092"]
    volumes: [kafka1-data:/var/lib/kafka/data]
    healthcheck: *kafka-healthcheck

  kafka2:
    <<: *kafka-broker
    container_name: gestorcitas-kafka2
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9093
    ports: ["9093:9093"]
    volumes: [kafka2-data:/var/lib/kafka/data]
    healthcheck: *kafka-healthcheck

  kafka3:
    <<: *kafka-broker
    container_name: gestorcitas-kafka3
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9094
    ports: ["9094:9094"]
    volumes: [kafka3-data:/var/lib/kafka/data]
    healthcheck: *kafka-healthcheck

  # Tarea única: crea los tópicos del sistema (idempotente, --if-not-exists) y termina
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: gestorcitas-kafka-init
    restart: "no"
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    environment:
      BOOTSTRAP: kafka1:29092,kafka2:29092,kafka3:29092
    volumes:
      - ./scripts/topicos.sh:/scripts/topicos.sh:ro
    entrypoint: ["bash", "/scripts/topicos.sh"]
    networks: [kafka]

  # Panel de administración y monitoreo: brokers, tópicos, particiones, mensajes, grupos, offsets y lag
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: gestorcitas-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    environment:
      KAFKA_CLUSTERS_0_NAME: gestorcitas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?Define KAFKA_UI_PASSWORD en el .env}
      JAVA_OPTS: "-Xms64m -Xmx256m"
      TZ: America/Santiago
    ports:
      - "8090:8080"
    networks: [kafka]

networks:
  kafka:
    name: gestorcitas-kafka   # nombre fijo: los microservicios locales (repo backend) se unen a esta red

volumes:
  zookeeper1-data:
  zookeeper1-log:
  zookeeper2-data:
  zookeeper2-log:
  zookeeper3-data:
  zookeeper3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
